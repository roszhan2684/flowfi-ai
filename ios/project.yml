name: FlowFi
options:
  bundleIdPrefix: dev.roszhan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FlowFiCore:
    path: Packages/FlowFiCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  FlowFi:
    type: application
    platform: iOS
    sources:
      - path: FlowFi
    dependencies:
      - package: FlowFiCore
    info:
      path: FlowFi/Info.plist
      properties:
        CFBundleDisplayName: FlowFi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: FlowFi uses Face ID to unlock the app and to confirm medium-risk approvals. Nothing leaves your device.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.roszhan.flowfi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  FlowFi:
    build:
      targets:
        FlowFi: all
    test:
      targets: []
