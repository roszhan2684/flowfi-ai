name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  swift-core:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/Packages/FlowFiCore
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
